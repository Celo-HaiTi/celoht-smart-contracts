name: Deploy Celo Sepolia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: celo-sepolia
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment secrets are configured
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USDM_ADDRESS_CELO_SEPOLIA: ${{ secrets.USDM_ADDRESS_CELO_SEPOLIA }}
          GENERAL_TREASURY: ${{ secrets.GENERAL_TREASURY }}
          EDUCATION_TREASURY: ${{ secrets.EDUCATION_TREASURY }}
          REFORESTATION_TREASURY: ${{ secrets.REFORESTATION_TREASURY }}
          GOVERNANCE_TREASURY: ${{ secrets.GOVERNANCE_TREASURY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          for secret_name in \
            SEPOLIA_RPC_URL \
            PRIVATE_KEY \
            USDM_ADDRESS_CELO_SEPOLIA \
            GENERAL_TREASURY \
            EDUCATION_TREASURY \
            REFORESTATION_TREASURY \
            GOVERNANCE_TREASURY \
            BLOCKSCOUT_API_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required deployment secret: ${secret_name}" >&2
              exit 1
            fi
            echo "✓ ${secret_name} configured"
          done

      - name: Compile
        run: npm run compile

      - name: Validate Celo Sepolia readiness
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USDM_ADDRESS_CELO_SEPOLIA: ${{ secrets.USDM_ADDRESS_CELO_SEPOLIA }}
          GENERAL_TREASURY: ${{ secrets.GENERAL_TREASURY }}
          EDUCATION_TREASURY: ${{ secrets.EDUCATION_TREASURY }}
          REFORESTATION_TREASURY: ${{ secrets.REFORESTATION_TREASURY }}
          GOVERNANCE_TREASURY: ${{ secrets.GOVERNANCE_TREASURY }}
        run: npm run check:deployment

      - name: Deploy explicitly to Celo Sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USDM_ADDRESS_CELO_SEPOLIA: ${{ secrets.USDM_ADDRESS_CELO_SEPOLIA }}
          GENERAL_TREASURY: ${{ secrets.GENERAL_TREASURY }}
          EDUCATION_TREASURY: ${{ secrets.EDUCATION_TREASURY }}
          REFORESTATION_TREASURY: ${{ secrets.REFORESTATION_TREASURY }}
          GOVERNANCE_TREASURY: ${{ secrets.GOVERNANCE_TREASURY }}
        run: npm run deploy:sepolia

      - name: Verify deployed contracts on Celo Sepolia Blockscout
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          USDM_ADDRESS_CELO_SEPOLIA: ${{ secrets.USDM_ADDRESS_CELO_SEPOLIA }}
          GENERAL_TREASURY: ${{ secrets.GENERAL_TREASURY }}
          EDUCATION_TREASURY: ${{ secrets.EDUCATION_TREASURY }}
          REFORESTATION_TREASURY: ${{ secrets.REFORESTATION_TREASURY }}
          GOVERNANCE_TREASURY: ${{ secrets.GOVERNANCE_TREASURY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: npm run verify:sepolia

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celo-sepolia-deployment
          path: deployments/celoSepolia.json
          if-no-files-found: warn
